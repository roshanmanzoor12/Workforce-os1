[alembic]
script_location = %(here)s/migrations/tenant
prepend_sys_path = %(here)s

# Tenant database URLs are NOT stored here.
#
# migrations/tenant/env.py resolves the target database using:
#
#     -x database_name=tenant_<workspace_uuid_hex>
#
# and builds the connection URL from trusted server configuration.
#
# Never add tenant credentials or arbitrary tenant URLs to this file.


[post_write_hooks]
# No post-write hooks currently required.